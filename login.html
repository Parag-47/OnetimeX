<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Login</title>
</head>

<body>
    <div class="font-[sans-serif] bg-gray-900 min-h-screen flex items-center justify-center px-4">
        <div class="grid md:grid-cols-2 bg-white rounded-xl shadow-lg overflow-hidden w-full max-w-5xl">
            <!-- Left Side - Image -->
            <div class="hidden md:flex items-center justify-center bg-gray-100 p-6">
                <img src="login img//access-account_aydp.svg" class="max-w-[80%] h-auto object-contain"
                    alt="Login Illustration" />
            </div>

            <!-- Right Side - Form -->
            <div class="flex items-center p-8 w-full">
                <form class="w-full mx-auto">
                    <!-- Logo Section -->
                    <div class="flex justify-center mb-6">
                        <img src="logo/logo.png" class="h-20" alt="Company Logo">
                    </div>

                    <div class="mb-8 text-center">
                        <h3 class="text-gray-800 text-3xl font-bold">Login</h3>
                        <p class="text-gray-600 text-md mt-2">
                            Don't have an account?
                            <a href="signup.html" target="_blank"
                                class="text-blue-600 font-medium hover:underline ml-1">Register here</a>
                        </p>
                    </div>

                    <!-- Mobile Number Input -->
                    <div class="mb-4">
                        <label class="text-gray-700 text-lg font-medium block mb-2">Mobile Number</label>
                        <input name="mobile" type="tel" pattern="\d*" required
                            class="w-full text-md border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-gray-800 focus:ring-1 focus:ring-gray-800 transition"
                            placeholder="Enter mobile number" />
                    </div>

                    <!-- Send OTP Button -->
                    <div class="mt-4">
                        <button type="button"
                            class="w-full py-3 px-6 text-md font-semibold rounded-lg text-white bg-gray-800 hover:bg-black transition focus:outline-none">
                            Send OTP
                        </button>
                    </div>

                    <!-- OTP Input -->
                    <div class="mt-6">
                        <label class="text-gray-700 text-lg font-medium block mb-2">Enter OTP</label>
                        <input id="otp-input" name="otp" type="text" pattern="\d*" required
                            class="w-full text-md border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-gray-800 focus:ring-1 focus:ring-gray-800 transition"
                            placeholder="Enter OTP"
                            oninput="document.getElementById('verify-button').disabled = this.value.length === 0 || /[^0-9]/.test(this.value)" />
                    </div>

                    <!-- Verify & Login Button -->
                    <div class="mt-6">
                        <button id="verify-button" type="button" disabled
                            class="w-full py-3 px-6 text-md font-semibold rounded-lg text-white bg-gray-400 transition focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">
                            Verify & Login
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
